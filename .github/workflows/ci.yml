name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: payment_db
          POSTGRES_USER: payment_user
          POSTGRES_PASSWORD: payment_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/payment_db
          DATABASE_USERNAME: payment_user
          DATABASE_PASSWORD: payment_password
          STRIPE_API_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          JWT_SECRET: test-secret-key-for-ci-pipeline-must-be-at-least-256-bits

      - name: Run unit tests
        run: ./gradlew test --tests "*Test"
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/payment_db
          DATABASE_USERNAME: payment_user
          DATABASE_PASSWORD: payment_password
          STRIPE_API_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          JWT_SECRET: test-secret-key-for-ci-pipeline-must-be-at-least-256-bits

      - name: Run integration tests
        run: ./gradlew test --tests "*IntegrationTest"
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/payment_db
          DATABASE_USERNAME: payment_user
          DATABASE_PASSWORD: payment_password
          STRIPE_API_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          JWT_SECRET: test-secret-key-for-ci-pipeline-must-be-at-least-256-bits

      - name: Generate test report
        if: always()
        run: ./gradlew testReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/

      - name: Build Docker image
        run: docker build -t payment-api:${{ github.sha }} .

      - name: Docker image scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: payment-api:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
